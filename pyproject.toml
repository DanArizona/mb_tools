[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name (what pip installs). Hyphen is fine here.
name = "mb-tools"
version = "0.5.0.dev0"
description = "Private utility package for MB_* tooling"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{ name = "Dan Lamey" }]
dependencies = [
    "cryptography",
    "PyGetWindow",
    "PyYAML",
]

[project.optional-dependencies]
qt = ["PySide6"]
schwab = ["schwabdev"]
test = [
    "pytest",
]


[project.scripts]
mb-window-survey = "mb_tools.window_survey:main"
mb-pwidget-tree = "mb_tools.pwidget_tree:main"
mb-env-report = "mb_tools.env_report:main"
mb-schwab-auth = "mb_tools.schwab_secure.cli:main"


[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Include non-.py files inside the package.
[tool.setuptools.package-data]
mb_tools = ["defaults.env"]
